spring.application.name=demo

# Configuração do PostgreSQL

spring.datasource.url=jdbc:postgresql://localhost:5432/paga-mobile
spring.datasource.username=postgres
spring.datasource.password=12345678
spring.datasource.driver-class-name=org.postgresql.Driver


#configuração do Hibernete
# Configuração do Hibernate Alterado para validate para trabalhar em harmonia com o Flyway)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC


#Chave secreta

api.security.token.secret=${JWT_SECRET:my-secret-key}

#gerenciamento oo Flaway
spring.flyway.enabled=true

logging.level.org.springframework.security=DEBUG


